services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: '1.50'
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB_STAGING:-workflo_staging}
    environment:
      POSTGRES_DB: ${POSTGRES_DB_STAGING:-workflo_staging}
      POSTGRES_USER: ${POSTGRES_USER_STAGING:-workflo_stg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_STAGING:?POSTGRES_PASSWORD_STAGING is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-api:${API_TAG}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_STAGING:?DATABASE_URL_STAGING is required}
    command: ['pnpm', '--filter', '@workflo/db', 'exec', 'prisma', 'migrate', 'deploy']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - app_network

  landing:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-landing:${LANDING_TAG}
    restart: unless-stopped
    mem_limit: 512m
    cpus: '0.75'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://dev-api.workflo.space
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      - traefik.http.routers.workflo-landing-staging.rule=Host(`dev.workflo.space`)
      - traefik.http.routers.workflo-landing-staging.entrypoints=websecure
      - traefik.http.routers.workflo-landing-staging.tls=true
      - traefik.http.routers.workflo-landing-staging.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cf}
      - traefik.http.routers.workflo-landing-staging.tls.domains[0].main=dev.workflo.space
      - traefik.http.routers.workflo-landing-staging.tls.domains[0].sans=dev-portal.workflo.space,dev-work.workflo.space,dev-api.workflo.space
      - traefik.http.routers.workflo-landing-staging.priority=10000
      - traefik.http.services.workflo-landing-staging.loadbalancer.server.port=3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - traefik_network

  portal:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-portal:${PORTAL_TAG}
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.50'
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      - traefik.http.routers.workflo-portal-staging.rule=Host(`dev-portal.workflo.space`)
      - traefik.http.routers.workflo-portal-staging.entrypoints=websecure
      - traefik.http.routers.workflo-portal-staging.tls=true
      - traefik.http.routers.workflo-portal-staging.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cf}
      - traefik.http.routers.workflo-portal-staging.priority=10000
      - traefik.http.services.workflo-portal-staging.loadbalancer.server.port=8080
      # Team-only staging portal (seeded client account) — /health carve-out mirrors
      # the api router so the CI verify job keeps its 200 check.
      - traefik.http.middlewares.workflo-portal-staging-ipwhitelist.ipwhitelist.sourcerange=${TEAM_IPS:-127.0.0.1/32}
      - traefik.http.routers.workflo-portal-staging.middlewares=workflo-portal-staging-ipwhitelist
      - traefik.http.routers.workflo-portal-staging-health.rule=Host(`dev-portal.workflo.space`) && Path(`/health`)
      - traefik.http.routers.workflo-portal-staging-health.entrypoints=websecure
      - traefik.http.routers.workflo-portal-staging-health.tls=true
      - traefik.http.routers.workflo-portal-staging-health.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cf}
      - traefik.http.routers.workflo-portal-staging-health.priority=10001
      - traefik.http.routers.workflo-portal-staging-health.service=workflo-portal-staging
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - traefik_network

  workspace:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-workspace:${WORKSPACE_TAG}
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.50'
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      - traefik.http.routers.workflo-workspace-staging.rule=Host(`dev-work.workflo.space`)
      - traefik.http.routers.workflo-workspace-staging.entrypoints=websecure
      - traefik.http.routers.workflo-workspace-staging.tls=true
      - traefik.http.routers.workflo-workspace-staging.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cf}
      - traefik.http.routers.workflo-workspace-staging.priority=10000
      - traefik.http.services.workflo-workspace-staging.loadbalancer.server.port=8080
      - traefik.http.middlewares.workflo-workspace-staging-ipwhitelist.ipwhitelist.sourcerange=${TEAM_IPS:-127.0.0.1/32}
      - traefik.http.routers.workflo-workspace-staging.middlewares=workflo-workspace-staging-ipwhitelist
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - traefik_network

  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-api:${API_TAG}
    restart: unless-stopped
    mem_limit: 768m
    cpus: '1.00'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${API_TAG:-sha-initial}
      DATABASE_URL: ${DATABASE_URL_STAGING:?DATABASE_URL_STAGING is required}
      # RLS activation (ADR-007): set DATABASE_APP_URL_STAGING (workflo_app role) and
      # flip RLS_ENFORCED_STAGING=true in the server .env. Staging soaks the flip for
      # a sprint before production (ENGINEERING_STANDARDS → "RLS rollout").
      DATABASE_APP_URL: ${DATABASE_APP_URL_STAGING:-}
      RLS_ENFORCED: ${RLS_ENFORCED_STAGING:-false}
      # Credentials vault (module 17): 32-byte base64 KEK; absent → vault 503.
      CREDENTIALS_KEK_BASE64: ${CREDENTIALS_KEK_BASE64_STAGING:-}
      # The deploy step seeds via `compose run api ... seed`, which only sees THIS
      # environment. The seed fails closed in production builds when passwords are
      # unset (no Admin123! fallback on an internet-reachable stack) — so these must
      # be set in the server .env for the seed step to succeed.
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      SEED_EXECUTOR_PASSWORD: ${SEED_EXECUTOR_PASSWORD:-}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET_STAGING:?JWT_SECRET_STAGING is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_STAGING:-https://dev.workflo.space,https://dev-portal.workflo.space,https://dev-work.workflo.space}
      PORTAL_URL: ${PORTAL_URL_STAGING:-https://dev-portal.workflo.space}
      WORKSPACE_URL: ${WORKSPACE_URL_STAGING:-https://dev-work.workflo.space}
      # AR-53: host-only by default (empty → cookie domain omitted) — staging refresh
      # cookies must NOT ride the shared .workflo.space apex into production.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN_STAGING:-}
      SMTP_HOST: ${SMTP_HOST:-mail.workflo.space}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      # Telegram account linking (S6-05/06): API mints deep links + verifies the bot's calls.
      BOT_LINK_SECRET: ${BOT_LINK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      - traefik.http.routers.workflo-api-staging.rule=Host(`dev-api.workflo.space`)
      - traefik.http.routers.workflo-api-staging.entrypoints=websecure
      - traefik.http.routers.workflo-api-staging.tls=true
      - traefik.http.routers.workflo-api-staging.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cf}
      - traefik.http.routers.workflo-api-staging.priority=10000
      - traefik.http.services.workflo-api-staging.loadbalancer.server.port=4000
      # Team-only staging API (same TEAM_IPS as workspace) — the seeded demo accounts
      # must not be reachable from the open internet. /health stays public on its own
      # router (higher priority, no middleware) so the CI verify job keeps its honest
      # 200 check from GitHub runners.
      - traefik.http.middlewares.workflo-api-staging-ipwhitelist.ipwhitelist.sourcerange=${TEAM_IPS:-127.0.0.1/32}
      - traefik.http.routers.workflo-api-staging.middlewares=workflo-api-staging-ipwhitelist
      - traefik.http.routers.workflo-api-staging-health.rule=Host(`dev-api.workflo.space`) && Path(`/health`)
      - traefik.http.routers.workflo-api-staging-health.entrypoints=websecure
      - traefik.http.routers.workflo-api-staging-health.tls=true
      - traefik.http.routers.workflo-api-staging-health.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cf}
      - traefik.http.routers.workflo-api-staging-health.priority=10001
      - traefik.http.routers.workflo-api-staging-health.service=workflo-api-staging
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - traefik_network
      - app_network

  bot:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-bot:${BOT_TAG}
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.50'
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN:-}
      # Bot → API link completion (shared secret + internal API URL on app_network).
      BOT_LINK_SECRET: ${BOT_LINK_SECRET:-}
      BOT_API_URL: ${BOT_API_URL:-http://api:4000}
      SENTRY_DSN: ${SENTRY_DSN:-}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_network}

volumes:
  postgres_data:
