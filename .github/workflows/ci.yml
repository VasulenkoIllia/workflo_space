name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @workflo/db db:generate

      - name: Type check
        run: pnpm turbo type-check

      - name: Lint
        run: pnpm turbo lint

      - name: Test
        run: pnpm turbo test

  # AR-01: shared with staging/production deploy workflows (the actual delivery
  # path is direct push → those workflows; this PR entry stays for future PR flow).
  db:
    name: DB gate
    uses: ./.github/workflows/db-gate.yml

  # Playwright smoke: ephemeral stack + drive the implemented screens (login, key
  # pages render, no uncaught/4xx/5xx). Catches render-crash/missing-data regressions
  # the unit gate can't — there are no frontend unit tests.
  smoke:
    name: Smoke
    uses: ./.github/workflows/smoke.yml
