name: Deploy to Production

on:
  push:
    branches: [main]

# AR-02: serialize deploys — overlapping pushes must not race on server state
# (docker rm/prune, .last_deploy/.previous_deploy bookkeeping).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  RUNTIME_ROOT: /var/www/srv/workflo
  PRODUCTION_COMPOSE_PROJECT: workflo-production
  IMAGE_RETENTION: 5

jobs:
  check:
    name: Type check & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @workflo/db db:generate

      - name: Type check
        run: pnpm turbo type-check

      - name: Lint
        run: pnpm turbo lint

      - name: Test
        run: pnpm turbo test

  # AR-01: real-PG gate (migration smoke + drift + RLS isolation + money invariants)
  # blocks every production deploy.
  db:
    name: DB gate
    uses: ./.github/workflows/db-gate.yml

  # Pre-deploy smoke (ephemeral stack) — same gate as staging; blocks a prod build
  # if a key screen crashes / loses data / regresses auth.
  smoke:
    name: Smoke
    uses: ./.github/workflows/smoke.yml

  build:
    name: Build ${{ matrix.app }}
    needs: [check, db, smoke]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [landing, portal, workspace, api, bot]
    steps:
      - uses: actions/checkout@v4

      - name: Normalize registry owner (lowercase)
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticated Docker Hub pulls — raises the anonymous 100/6h rate limit that was
      # timing out buildkit + base-image (node/nginx) pulls on shared runner IPs.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/workflo-${{ matrix.app }}:sha-${{ github.sha }}
          # Baked into the SPA bundles (portal/workspace). Ignored by api/bot/landing
          # Dockerfiles (they don't declare the ARG). Production API host.
          build-args: |
            VITE_API_URL=https://api.workflo.space
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  approval:
    name: Waiting for approval
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved
        run: echo "Production deployment approved"

  deploy-production:
    name: Deploy to production
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync runtime manifests
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7 — pinned by SHA (SSH key access)
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # scripts/ — the manual rollback + healthcheck live ON the server; without
          # syncing them here a rollback.sh fix in the repo never reaches the box.
          source: 'docker-compose.production.yml,infra/maintenance/**,infra/postgres/**,scripts/rollback.sh,scripts/healthcheck.sh'
          target: '${{ env.RUNTIME_ROOT }}/production'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 — third-party action with HETZNER_SSH_KEY access: pin by SHA, not moving tag
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # Default is 10m. Pulling 5 GHCR images (~200MB each) onto the host can exceed that
          # when a layer download stalls, killing an otherwise-healthy deploy. 20m + per-pull
          # retry (below) absorbs transient GHCR/network stalls.
          command_timeout: 20m
          script: |
            set -e
            cd "${{ env.RUNTIME_ROOT }}/production"

            compose() {
              docker compose --project-name "${{ env.PRODUCTION_COMPOSE_PROJECT }}" --env-file .env -f docker-compose.production.yml "$@"
            }

            cleanup_legacy_project_if_conflicting() {
              project_name="$1"
              label_filter="$2"
              legacy_ids="$(docker ps -q --filter "label=com.docker.compose.project=${project_name}" --filter "label=${label_filter}")"
              if [[ -n "$legacy_ids" ]]; then
                echo "Found legacy compose project '${project_name}' with conflicting Traefik labels. Stopping it."
                docker compose --project-name "${project_name}" --env-file .env -f docker-compose.production.yml down --remove-orphans || true
              fi
            }

            cleanup_conflicting_router_containers() {
              label_filter="$1"
              current_project="${{ env.PRODUCTION_COMPOSE_PROJECT }}"
              ids="$(docker ps -q --filter "label=${label_filter}")"
              if [[ -z "$ids" ]]; then
                return 0
              fi

              for cid in $ids; do
                project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$cid" 2>/dev/null || true)"
                name="$(docker inspect -f '{{ .Name }}' "$cid" 2>/dev/null | sed 's#^/##' || true)"
                if [[ "$project" != "$current_project" ]]; then
                  echo "Removing conflicting container '${name}' (project='${project}') for label '${label_filter}'"
                  docker rm -f "$cid" || true
                fi
              done
            }

            cleanup_legacy_project_if_conflicting production 'traefik.http.routers.workflo-api.rule=Host(`api.workflo.space`)'
            cleanup_legacy_project_if_conflicting production 'traefik.http.routers.api.rule=Host(`api.workflo.space`)'
            cleanup_legacy_project_if_conflicting workflo_space 'traefik.http.routers.workflo-api.rule=Host(`api.workflo.space`)'
            cleanup_legacy_project_if_conflicting workflo_space 'traefik.http.routers.api.rule=Host(`api.workflo.space`)'
            cleanup_conflicting_router_containers 'traefik.http.routers.workflo-api.rule=Host(`api.workflo.space`)'
            cleanup_conflicting_router_containers 'traefik.http.routers.api.rule=Host(`api.workflo.space`)'

            # AR-05: .last_deploy now only ever holds VERIFIED tags (written by the
            # verify job), so .previous_deploy is always a safe rollback target.
            current_tag=$(cat .last_deploy 2>/dev/null || echo "none")
            echo "$current_tag" > .previous_deploy

            new_tag=sha-${{ github.sha }}

            export LANDING_TAG=$new_tag
            export PORTAL_TAG=$new_tag
            export WORKSPACE_TAG=$new_tag
            export API_TAG=$new_tag
            export BOT_TAG=$new_tag
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # GHCR layer pulls occasionally stall mid-download on the host (transient network).
            # `timeout` wraps `docker compose` DIRECTLY — not the compose() shell function, which
            # timeout can't exec (it runs a binary, not shell functions) — so a stalled pull is
            # aborted and retried instead of hanging. 3 × 6m < the 20m command_timeout above.
            pull_with_retry() {
              for attempt in 1 2 3; do
                if timeout 360 docker compose --project-name "${{ env.PRODUCTION_COMPOSE_PROJECT }}" --env-file .env -f docker-compose.production.yml pull; then
                  return 0
                fi
                echo "WARN: image pull failed/stalled (attempt ${attempt}/3); retrying in 10s..."
                sleep 10
              done
              echo "FATAL: image pull failed after 3 attempts"
              return 1
            }
            pull_with_retry
            compose build postgres
            compose up -d postgres

            ensure_pg_cron_enabled() {
              retries=20

              for attempt in $(seq 1 "$retries"); do
                if compose exec -T postgres sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS pg_cron;" && psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT extname FROM pg_extension WHERE extname='\''pg_cron'\''" | grep -q pg_cron'; then
                  echo "pg_cron extension is enabled"
                  return 0
                fi
                sleep 3
              done

              echo "Failed to enable pg_cron extension"
              compose logs postgres || true
              return 1
            }

            ensure_pg_cron_enabled

            # AR-03: blocking — Prisma has no down-migrations; restore-from-backup IS
            # the rollback plan (INFRASTRUCTURE.md §12.3), so production must never
            # migrate without a verified backup.
            echo "Backing up DB before migrations (blocking)..."
            mkdir -p backups
            raw_dump="backups/pre-migrate-$(date +%Y%m%d-%H%M%S).sql"
            if ! compose exec -T postgres sh -lc 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner --clean --if-exists' > "$raw_dump"; then
              echo "FATAL: pre-migrate backup failed — refusing to run migrations"
              rm -f "$raw_dump"
              exit 1
            fi
            dump_bytes=$(wc -c < "$raw_dump")
            if (( dump_bytes < 1024 )); then
              echo "FATAL: pre-migrate backup is suspiciously small (${dump_bytes} bytes) — refusing to run migrations"
              exit 1
            fi
            gzip -f "$raw_dump"
            ls -1t backups/pre-migrate-*.sql.gz 2>/dev/null | tail -n +11 | xargs -r rm -f

            echo "Applying database migrations (prisma migrate deploy)..."
            compose run --rm --no-deps migrate

            # AR-04: --wait blocks until healthchecked services report healthy (bot has
            # no HTTP surface → no healthcheck → counted as started). Replaces the old
            # `compose ps` grep, which passed containers that crashed seconds later.
            if ! compose up -d --no-deps --wait --wait-timeout 180 api bot portal workspace landing; then
              echo "Deploy failed: services did not become healthy within 180s"
              compose ps
              compose logs --tail 50 api landing portal workspace bot || true
              exit 1
            fi

            cleanup_old_workflo_images() {
              keep_count="${{ env.IMAGE_RETENTION }}"
              if ! [[ "$keep_count" =~ ^[0-9]+$ ]] || (( keep_count < 1 )); then
                keep_count=5
              fi

              for app in landing portal workspace api bot; do
                repo="ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-${app}"
                mapfile -t image_ids < <(docker image ls "$repo" --format '{{.ID}}' | awk '!seen[$0]++')
                if (( ${#image_ids[@]} <= keep_count )); then
                  continue
                fi

                for image_id in "${image_ids[@]:$keep_count}"; do
                  docker image rm "$image_id" >/dev/null 2>&1 || true
                done
              done

              # Remove dangling layers (including leftovers from local postgres builds).
              docker image prune -f >/dev/null 2>&1 || true
            }

            cleanup_old_workflo_images

            wait_for_non_default_cert() {
              host="$1"
              check_path="$2"
              retries=12

              for attempt in $(seq 1 "$retries"); do
                cert_info="$(openssl s_client -connect 127.0.0.1:443 -servername "$host" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null || true)"
                if echo "$cert_info" | grep -Fq "DNS:${host}" && ! echo "$cert_info" | grep -Fq "TRAEFIK DEFAULT CERT"; then
                  echo "TLS OK: $host"
                  return 0
                fi

                curl -ksS -o /dev/null "https://${host}${check_path}" || true
                sleep 5
              done

              echo "TLS FAIL: non-default cert was not issued for ${host}"
              openssl s_client -connect 127.0.0.1:443 -servername "$host" </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName || true
              return 1
            }

            wait_for_non_default_cert workflo.space /
            wait_for_non_default_cert portal.workflo.space /health
            wait_for_non_default_cert work.workflo.space /health
            wait_for_non_default_cert api.workflo.space /health

  verify:
    name: Verify and rollback
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Health check
        run: ./scripts/healthcheck.sh --env production --delay 20 --retries 3 --retry-delay 5

      # AR-05: record the tag as last-known-good ONLY after verification passed,
      # so a failed first deploy can never poison the rollback bookkeeping.
      - name: Record verified deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 — third-party action with HETZNER_SSH_KEY access: pin by SHA, not moving tag
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.RUNTIME_ROOT }}/production"
            echo "sha-${{ github.sha }}" > .last_deploy

            # Persist the verified image tags into .env so manual `docker compose` ops
            # (rollback, container recreate) use the deployed images without re-exporting
            # *_TAG (otherwise compose falls back to the bogus `sha-initial`). Only the
            # last-known-GOOD tags land here — this runs after verification passed.
            for var in LANDING_TAG PORTAL_TAG WORKSPACE_TAG API_TAG BOT_TAG; do
              if grep -q "^${var}=" .env 2>/dev/null; then
                sed -i "s|^${var}=.*|${var}=sha-${{ github.sha }}|" .env
              else
                echo "${var}=sha-${{ github.sha }}" >> .env
              fi
            done

      - name: Auto rollback on failure
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 — third-party action with HETZNER_SSH_KEY access: pin by SHA, not moving tag
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.RUNTIME_ROOT }}/production"

            compose() {
              docker compose --project-name "${{ env.PRODUCTION_COMPOSE_PROJECT }}" --env-file .env -f docker-compose.production.yml "$@"
            }

            prev_tag=$(cat .previous_deploy)

            export LANDING_TAG=$prev_tag
            export PORTAL_TAG=$prev_tag
            export WORKSPACE_TAG=$prev_tag
            export API_TAG=$prev_tag
            export BOT_TAG=$prev_tag
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # --wait: a rollback onto crashing containers must fail this job loudly,
            # not report success. The schema stays forward — expand/contract discipline
            # (ENGINEERING_STANDARDS → "Migration discipline") is what keeps the old
            # image compatible; restore-from-backup remains the manual escape hatch.
            compose up -d --wait --wait-timeout 180
