name: Deploy to Production

on:
  push:
    branches: [main]

# AR-02: serialize deploys — overlapping pushes must not race on server state
# (docker rm/prune, .last_deploy/.previous_deploy bookkeeping).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Production
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      compose_project: workflo-production
      vite_api_url: https://api.workflo.space
      api_host: api.workflo.space
      tls_hosts: workflo.space|/ portal.workflo.space|/health work.workflo.space|/health api.workflo.space|/health
      # Landing is deliberately NOT rolled out to production yet (owner decision 27.09,
      # docs/LANDING_SEO_PLAN.md §0): workflo.space keeps the tag it already runs. Add
      # "landing" here on the launch day.
      apps: '["portal","workspace","api","bot"]'
      require_approval: true
