name: Deploy to Staging

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  RUNTIME_ROOT: /var/www/srv/workflo
  STAGING_COMPOSE_PROJECT: workflo-staging

jobs:
  check:
    name: Type check & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @workflo/db db:generate

      - name: Type check
        run: pnpm turbo type-check

      - name: Lint
        run: pnpm turbo lint

  build:
    name: Build ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [landing, portal, workspace, api, bot]
    steps:
      - uses: actions/checkout@v4

      - name: Normalize registry owner (lowercase)
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/workflo-${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync runtime manifests
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.staging.yml,infra/maintenance/**"
          target: "${{ env.RUNTIME_ROOT }}/staging"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.RUNTIME_ROOT }}/staging"

            compose() {
              docker compose --project-name "${{ env.STAGING_COMPOSE_PROJECT }}" --env-file .env -f docker-compose.staging.yml "$@"
            }

            export LANDING_TAG=sha-${{ github.sha }}
            export PORTAL_TAG=sha-${{ github.sha }}
            export WORKSPACE_TAG=sha-${{ github.sha }}
            export API_TAG=sha-${{ github.sha }}
            export BOT_TAG=sha-${{ github.sha }}
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            compose pull
            compose up -d postgres

            compose up -d --no-deps api
            compose up -d --no-deps bot
            compose up -d --no-deps landing
            compose up -d --no-deps portal
            compose up -d --no-deps workspace

            running_services="$(compose ps --status running --services)"
            for svc in postgres api bot landing portal workspace; do
              if ! echo "$running_services" | grep -qx "$svc"; then
                echo "Service '$svc' is not running after deploy"
                compose ps
                exit 1
              fi
            done

            wait_for_non_default_cert() {
              host="$1"
              check_path="$2"
              retries=12

              for attempt in $(seq 1 "$retries"); do
                cert_info="$(openssl s_client -connect 127.0.0.1:443 -servername "$host" </dev/null 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null || true)"
                if echo "$cert_info" | grep -Fq "DNS:${host}" && ! echo "$cert_info" | grep -Fq "TRAEFIK DEFAULT CERT"; then
                  echo "TLS OK: $host"
                  return 0
                fi

                curl -ksS -o /dev/null "https://${host}${check_path}" || true
                sleep 5
              done

              echo "TLS FAIL: non-default cert was not issued for ${host}"
              openssl s_client -connect 127.0.0.1:443 -servername "$host" </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName || true
              return 1
            }

            wait_for_non_default_cert dev.workflo.space /
            wait_for_non_default_cert dev-portal.workflo.space /health
            wait_for_non_default_cert dev-work.workflo.space /health
            wait_for_non_default_cert dev-api.workflo.space /health

            echo "sha-${{ github.sha }}" > .last_deploy

  health-check:
    name: Health check
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check staging endpoints
        run: ./scripts/healthcheck.sh --env staging --delay 20 --retries 6 --retry-delay 10
