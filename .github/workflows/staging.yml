name: Deploy to Staging

on:
  push:
    branches: [dev]
    # Docs-only pushes don't change anything that runs (AUDIT_2026-09-cicd N5) — skip the
    # ~9-minute rebuild of all 5 images. A push touching any other file deploys as usual.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# AR-02: serialize deploys — two quick pushes must not run two SSH sessions
# mutating the same server state concurrently. No cancel: a started deploy finishes.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Staging
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: staging
      compose_project: workflo-staging
      vite_api_url: https://dev-api.workflo.space
      api_host: dev-api.workflo.space
      router_suffix: '-staging'
      tls_hosts: dev.workflo.space|/ dev-portal.workflo.space|/health dev-work.workflo.space|/health dev-api.workflo.space|/health
      seed: true
