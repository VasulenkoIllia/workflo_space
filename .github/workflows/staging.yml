name: Deploy to Staging

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  RUNTIME_ROOT: /var/www/srv/workflo

jobs:
  check:
    name: Type check & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @workflo/db db:generate

      - name: Type check
        run: pnpm turbo type-check

      - name: Lint
        run: pnpm turbo lint

  build:
    name: Build ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [landing, portal, workspace, api, bot]
    steps:
      - uses: actions/checkout@v4

      - name: Normalize registry owner (lowercase)
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/workflo-${{ matrix.app }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd "${{ env.RUNTIME_ROOT }}/staging"

            export LANDING_TAG=sha-${{ github.sha }}
            export PORTAL_TAG=sha-${{ github.sha }}
            export WORKSPACE_TAG=sha-${{ github.sha }}
            export API_TAG=sha-${{ github.sha }}
            export BOT_TAG=sha-${{ github.sha }}
            export GITHUB_REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            docker compose -f docker-compose.staging.yml pull

            docker compose -f docker-compose.staging.yml up -d --no-deps api
            docker compose -f docker-compose.staging.yml up -d --no-deps bot
            docker compose -f docker-compose.staging.yml up -d --no-deps landing
            docker compose -f docker-compose.staging.yml up -d --no-deps portal
            docker compose -f docker-compose.staging.yml up -d --no-deps workspace

            echo "sha-${{ github.sha }}" > .last_deploy

  health-check:
    name: Health check
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check staging endpoints
        run: ./scripts/healthcheck.sh --env staging --delay 15 --retries 1
