  <script>
    // One-shot reset of the DesignCanvas pan/zoom state if it ever drifts
    // off-screen and leaves the user staring at a blank background. Gated
    // by a version flag so it only fires once per bump.
    (function () {
      var FLAG = 'dc-reset:v4';
      try {
        if (!localStorage.getItem(FLAG)) {
          Object.keys(localStorage).forEach(function (k) {
            if (k.indexOf('dc-viewport:') === 0) localStorage.removeItem(k);
          });
          localStorage.setItem(FLAG, '1');
        }
      } catch (e) {}
    })();
  </script>
