server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Hashed build assets (Vite emits content-hashed filenames) — safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA shell — never cache the HTML so a new deploy is picked up immediately
  # (index.html references the latest hashed assets). Fixes "deployed but UI is stale".
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
