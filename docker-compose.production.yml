services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    cpus: '2.00'
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB_PROD:-workflo_production}
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PROD:-workflo_production}
      POSTGRES_USER: ${POSTGRES_USER_PROD:-workflo_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD:?POSTGRES_PASSWORD_PROD is required}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-api:${API_TAG}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL_PROD:?DATABASE_URL_PROD is required}
    command: ['pnpm', '--filter', '@workflo/db', 'exec', 'prisma', 'migrate', 'deploy']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - app_network

  landing:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-landing:${LANDING_TAG}
    restart: unless-stopped
    mem_limit: 768m
    cpus: '1.00'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.workflo.space
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      - traefik.http.routers.workflo-landing.rule=Host(`workflo.space`) || Host(`www.workflo.space`)
      - traefik.http.routers.workflo-landing.entrypoints=websecure
      - traefik.http.routers.workflo-landing.tls=true
      - traefik.http.routers.workflo-landing.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cf}
      - traefik.http.routers.workflo-landing.tls.domains[0].main=workflo.space
      - traefik.http.routers.workflo-landing.tls.domains[0].sans=www.workflo.space,portal.workflo.space,work.workflo.space,api.workflo.space
      - traefik.http.routers.workflo-landing.priority=10000
      - traefik.http.services.workflo-landing.loadbalancer.server.port=3000
      - traefik.http.middlewares.workflo-www-redirect.redirectregex.regex=^https://www\\.workflo\\.space/(.*)
      - traefik.http.middlewares.workflo-www-redirect.redirectregex.replacement=https://workflo.space/$${1}
      - traefik.http.middlewares.workflo-www-redirect.redirectregex.permanent=true
      - traefik.http.routers.workflo-landing.middlewares=workflo-www-redirect
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - traefik_network

  portal:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-portal:${PORTAL_TAG}
    restart: unless-stopped
    mem_limit: 384m
    cpus: '0.75'
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      - traefik.http.routers.workflo-portal.rule=Host(`portal.workflo.space`)
      - traefik.http.routers.workflo-portal.entrypoints=websecure
      - traefik.http.routers.workflo-portal.tls=true
      - traefik.http.routers.workflo-portal.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cf}
      - traefik.http.routers.workflo-portal.priority=10000
      - traefik.http.services.workflo-portal.loadbalancer.server.port=8080
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - traefik_network

  workspace:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-workspace:${WORKSPACE_TAG}
    restart: unless-stopped
    mem_limit: 384m
    cpus: '0.75'
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      - traefik.http.routers.workflo-workspace.rule=Host(`work.workflo.space`)
      - traefik.http.routers.workflo-workspace.entrypoints=websecure
      - traefik.http.routers.workflo-workspace.tls=true
      - traefik.http.routers.workflo-workspace.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cf}
      - traefik.http.routers.workflo-workspace.priority=10000
      - traefik.http.services.workflo-workspace.loadbalancer.server.port=8080
      - traefik.http.middlewares.workflo-workspace-ipwhitelist.ipwhitelist.sourcerange=${TEAM_IPS:-127.0.0.1/32}
      - traefik.http.routers.workflo-workspace.middlewares=workflo-workspace-ipwhitelist
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - traefik_network

  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-api:${API_TAG}
    restart: unless-stopped
    mem_limit: 1g
    cpus: '1.50'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # ADR-006: keep workers inline by default; set false when the `worker` service runs.
      RUN_WORKERS_INLINE: ${RUN_WORKERS_INLINE:-true}
      APP_VERSION: ${API_TAG:-sha-initial}
      DATABASE_URL: ${DATABASE_URL_PROD:?DATABASE_URL_PROD is required}
      # RLS activation (ADR-007): set DATABASE_APP_URL_PROD (workflo_app role) and flip
      # RLS_ENFORCED_PROD=true in the server .env — no redeploy of this file needed.
      # migrate/worker deliberately keep the owner URL (DDL / cross-tenant drain).
      # NOTE: with inline workers (RUN_WORKERS_INLINE=true) the drain also runs as
      # workflo_app — fine while wf_in_tenant is permissive-on-unset + bypass GUC;
      # move to the `workers` profile before any deny-on-unset hardening.
      DATABASE_APP_URL: ${DATABASE_APP_URL_PROD:-}
      RLS_ENFORCED: ${RLS_ENFORCED_PROD:-false}
      # Credentials vault (module 17): 32-byte base64 KEK (`openssl rand -base64 32`).
      # Absent → vault endpoints return 503, the rest of the API is unaffected.
      CREDENTIALS_KEK_BASE64: ${CREDENTIALS_KEK_BASE64_PROD:-}
      # Google OAuth (S9 §E): all three set → login-via-Google on; absent → 503/hidden.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID_PROD:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET_PROD:-}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL_PROD:-https://api.workflo.space/auth/oauth/google/callback}
      JWT_SECRET: ${JWT_SECRET_PROD:?JWT_SECRET_PROD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_PROD:-https://workflo.space,https://portal.workflo.space,https://work.workflo.space}
      PORTAL_URL: ${PORTAL_URL_PROD:-https://portal.workflo.space}
      WORKSPACE_URL: ${WORKSPACE_URL_PROD:-https://work.workflo.space}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.workflo.space}
      SMTP_HOST: ${SMTP_HOST:-mail.workflo.space}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-noreply@workflo.space}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Workflo}
      BOT_TOKEN: ${BOT_TOKEN:-}
      # Telegram account linking (S6-05/06): API mints deep links + verifies the bot's calls.
      BOT_LINK_SECRET: ${BOT_LINK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BLOG_AI_MODEL: ${BLOG_AI_MODEL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Web-push (VAPID, notify-канал PUSH): не задано → канал мовчки off.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@workflo.space}
      # Inbound email→тікети (S12-05, docs/EMAIL_INBOUND_SETUP.md). Вмикати лише на
      # ОДНОМУ середовищі — два полери однієї скриньки розтягнуть листи між базами.
      INBOUND_IMAP_HOST: ${INBOUND_IMAP_HOST_PROD:-}
      INBOUND_IMAP_PORT: ${INBOUND_IMAP_PORT:-993}
      INBOUND_IMAP_USER: ${INBOUND_IMAP_USER_PROD:-}
      INBOUND_IMAP_PASSWORD: ${INBOUND_IMAP_PASSWORD_PROD:-}
      INBOUND_IMAP_SECURE: ${INBOUND_IMAP_SECURE:-true}
      INBOUND_IMAP_MAILBOX: ${INBOUND_IMAP_MAILBOX:-INBOX}
      # Публічні лінки у листах (unsubscribe/рахунок) + HMAC-секрет відписки
      # (fallback JWT_SECRET — але тоді він МУСИТЬ збігатись між api і worker).
      API_PUBLIC_URL: ${API_PUBLIC_URL_PROD:-https://api.workflo.space}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
      # Superadmin-allowlist (auth/can.ts, крос-тенант /admin/*). Порожньо → нікого.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # INFRA-DR1: клієнтські файли — на named volume; без нього вони жили в шарі
      # контейнера і гинули при КОЖНОМУ recreate. backup.sh тарить цей volume щоночі.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_network}
      - traefik.http.routers.workflo-api.rule=Host(`api.workflo.space`)
      - traefik.http.routers.workflo-api.entrypoints=websecure
      - traefik.http.routers.workflo-api.tls=true
      - traefik.http.routers.workflo-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cf}
      - traefik.http.routers.workflo-api.priority=10000
      - traefik.http.services.workflo-api.loadbalancer.server.port=4000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - traefik_network
      - app_network

  # ADR-006: dedicated background worker (chat-listener + outbox drain). Opt-in —
  # enable with `--profile workers` AND set RUN_WORKERS_INLINE=false on the api
  # service, so the drain loop runs here instead of in every web replica.
  worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-api:${API_TAG}
    profiles: ['workers']
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.00'
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # No DATABASE_APP_URL here — the worker keeps the owner connection and drains
      # ALL tenants by design (ADR-007 activation checklist, step 3). RLS_ENFORCED is
      # passed only so worker.ts logs its owner-connection reminder on the flip.
      RLS_ENFORCED: ${RLS_ENFORCED_PROD:-false}
      DATABASE_URL: ${DATABASE_URL_PROD:?DATABASE_URL_PROD is required}
      JWT_SECRET: ${JWT_SECRET_PROD:?JWT_SECRET_PROD is required}
      PORTAL_URL: ${PORTAL_URL_PROD:-https://portal.workflo.space}
      SMTP_HOST: ${SMTP_HOST:-mail.workflo.space}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-noreply@workflo.space}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Workflo}
      BOT_TOKEN: ${BOT_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Worker рендерить/шле листи й пуші (outbox-drain) — той самий notify-набір,
      # що й в api, інакше unsubscribe-підписи/пуші розійдуться між процесами.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@workflo.space}
      INBOUND_IMAP_HOST: ${INBOUND_IMAP_HOST_PROD:-}
      INBOUND_IMAP_PORT: ${INBOUND_IMAP_PORT:-993}
      INBOUND_IMAP_USER: ${INBOUND_IMAP_USER_PROD:-}
      INBOUND_IMAP_PASSWORD: ${INBOUND_IMAP_PASSWORD_PROD:-}
      INBOUND_IMAP_SECURE: ${INBOUND_IMAP_SECURE:-true}
      INBOUND_IMAP_MAILBOX: ${INBOUND_IMAP_MAILBOX:-INBOX}
      API_PUBLIC_URL: ${API_PUBLIC_URL_PROD:-https://api.workflo.space}
      UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:-}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - app_network

  bot:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/workflo-bot:${BOT_TAG}
    restart: unless-stopped
    mem_limit: 384m
    cpus: '0.75'
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN:-}
      # Bot → API link completion (shared secret + internal API URL on app_network).
      BOT_LINK_SECRET: ${BOT_LINK_SECRET:-}
      BOT_API_URL: ${BOT_API_URL:-http://api:4000}
      SENTRY_DSN: ${SENTRY_DSN:-}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - app_network

  maintenance:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: '0.25'
    volumes:
      - ./infra/maintenance:/usr/share/nginx/html:ro
    profiles:
      - maintenance
    labels:
      - traefik.enable=false
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - traefik_network

networks:
  app_network:
    driver: bridge

  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_network}

volumes:
  postgres_data:
  uploads_data:
